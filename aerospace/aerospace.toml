# ~/.aerospace.toml

# 1. BASIC SETTINGS
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 2. ZERO GAPS (Maximize screen real estate)
[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

# 3. KEYBINDINGS
# We use 'alt' (Option) for everything.

[mode.main.binding]

# --- FOCUS (Move cursor between windows) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- MOVING WINDOWS (Swap positions) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- WORKSPACES (Manual Switching) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# --- THROW WINDOW TO WORKSPACE ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# --- RESIZING (The Fast Way) ---
# Use Alt + Minus to shrink, Alt + Equal to grow
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# --- UTILS ---
alt-slash = 'layout tiles horizontal vertical' # Flip split direction (Horizontal <-> Vertical)
alt-f = 'fullscreen'
alt-shift-r = 'reload-config'
alt-shift-q = 'close'  # Fast way to close a window

# Toggle between "Tiling" (side-by-side) and "Accordion" (stacked like cards)
alt-s = 'layout accordion tiles'

