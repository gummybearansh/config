# ==========================
# Base Tmux Configuration
# ==========================
set -g prefix C-b
set -g mouse on
set-option -g status-position top # Moved to the bottom

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind : command-prompt

# ==========================
# Vim-Tmux Navigator
# ==========================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

# ==========================
# Plugins
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ==========================
# Lualine-Matching Purple Theme
# ==========================
set -g status-style "bg=default,fg=#f8f8f2"

set -g window-status-separator "  "

# Left: Session name (Solid purple background, black text to perfectly match the "NORMAL" block)
set -g status-left-length 100
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=default,fg=default]  "

# Middle: Inactive tabs (Muted Dracula gray/purple)
set -g window-status-format "#[fg=#6272a4]#I:#W "

# Middle: Active tab (Bright Dracula purple)
set -g window-status-current-format "#[fg=#bd93f9,bold]#I:#W* "

set-option -g allow-rename off

# Right: Muted clock & CPU/RAM
set -g status-right-length 100
set -g status-right "#[fg=#6272a4] #{cpu_percentage}   #{ram_percentage}  %I:%M %p "

